# ===========================================
# COTURN TURN SERVER CONFIGURATION
# Production-ready WebRTC relay
# ===========================================

# Network settings
listening-port=3478
tls-listening-port=5349

# Relay ports range
min-port=49152
max-port=65535

# Authentication
# Replace with strong credentials in production
user=proconnect:your-secure-turn-password
realm=proconnect.com

# Security
fingerprint
lt-cred-mech

# Logging
log-file=/var/log/turnserver/turnserver.log
verbose

# Performance
total-quota=100
bps-capacity=0
stale-nonce=600

# SSL/TLS (uncomment and configure for production)
# cert=/etc/ssl/certs/turn_server_cert.pem
# pkey=/etc/ssl/private/turn_server_pkey.pem

# Prevent relay to private IPs (security)
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
