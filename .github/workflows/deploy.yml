name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: orbixa-ai
  REGION: asia-south1
  REPO: proconnect-backend
  SERVICE: proconnect-backend
  RUN_SERVICE_ACCOUNT: proconnect-run@orbixa-ai.iam.gserviceaccount.com
  WIF_PROVIDER: projects/753154951380/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: github-actions-deployer@orbixa-ai.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}"
          gcloud run deploy "${{ env.SERVICE }}" \
            --image="$IMAGE" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --service-account="${{ env.RUN_SERVICE_ACCOUNT }}" \
            --allow-unauthenticated \
            --port=3000 \
            --set-env-vars="NODE_ENV=production,API_VERSION=v1,REDIS_HOST=redis-10984.crce179.ap-south-1-1.ec2.cloud.redislabs.com,REDIS_PORT=10984,REDIS_TLS=true,REDIS_DB=0,JWT_ACCESS_EXPIRY=59m,JWT_REFRESH_EXPIRY=7d,GOOGLE_CLIENT_ID=222858554688-49n713ameuojk92r3p13nckr3cq0o0i5.apps.googleusercontent.com,CLOUDINARY_CLOUD_NAME=Pro-Connect,CLOUDINARY_API_KEY=513628537746819,STUN_SERVER=stun:stun.l.google.com:19302,CORS_CREDENTIALS=true,RATE_LIMIT_WINDOW_MS=900000,RATE_LIMIT_MAX_REQUESTS=100,MAX_FILE_SIZE=10485760,LOG_LEVEL=info,LOG_FILE_PATH=./logs" \
            --set-secrets="JWT_ACCESS_SECRET=jwt-access-secret:latest,JWT_REFRESH_SECRET=jwt-refresh-secret:latest,COOKIE_SECRET=cookie-secret:latest,MONGODB_URI=mongodb-uri:latest,REDIS_PASSWORD=redis-password:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,CLOUDINARY_API_SECRET=cloudinary-api-secret:latest"

      - name: Point OAuth callback at this service's URL
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE }}" --region="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" --format='value(status.url)')
          gcloud run services update "${{ env.SERVICE }}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --update-env-vars="GOOGLE_CALLBACK_URL=$URL/api/v1/auth/google/callback"
          echo "Deployed to: $URL"
